<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">DDA metapipeline workflow</title>
  <desc id="figure-description">The DDA metapipeline supports Comet, Sage, and MSFragger search, individually or together. mzML fractions pass through search and PSM validation. Depending on experiment type, validated idXML and mzML files enter either TMT or LFQ quantitation. ConsensusXML and unfiltered PEP-scored idXML pass to protein quantitation. DDA quality control summarizes the mzML, search, validation, protein grouping, and abundance outputs. A target-decoy FASTA is shared by search, validation, and protein quantitation.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183044; }
      .name { font-size: 20px; font-weight: 700; }
      .tool { font-size: 16px; fill: #3e5868; }
      .small { font-size: 14px; fill: #536b79; }
      .handoff { font-size: 13px; font-weight: 700; fill: #334d5b; }
      .card { fill: #fff; stroke: #c4d4dc; stroke-width: 1.5; }
      .choice { fill: #f7fafb; stroke: #d8e3e8; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #52758a; stroke-width: 3; marker-end: url(#arrowhead); }
      .input { fill: none; stroke: #159a89; stroke-width: 2.5; marker-end: url(#tealhead); }
      .bus { fill: none; stroke: #159a89; stroke-width: 2.5; }
      .aux { fill: none; stroke: #775ca6; stroke-width: 2.5; marker-end: url(#purplehead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52758a"/></marker>
    <marker id="tealhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#159a89"/></marker>
    <marker id="purplehead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#775ca6"/></marker>
  </defs>
  <rect width="1600" height="720" fill="#f7fafb"/>

  <rect x="50" y="34" width="1500" height="96" rx="16" class="card"/>
  <rect x="50" y="34" width="9" height="96" rx="4" fill="#159a89"/>
  <text x="78" y="73" class="name">Sample or plex mzML fractions</text>
  <text x="78" y="102" class="tool">Input CSV: sample_name, fraction_id, path  ·  annotation_id only for ProtLoom</text>
  <path d="M195 130 V183 H1000" class="bus"/>
  <path d="M195 183 V235" class="input"/>
  <path d="M550 183 V235" class="input"/>
  <path d="M1000 183 V235" class="input"/>
  <text x="615" y="172" class="handoff" style="fill:#158675">mzML files</text>

  <rect x="50" y="235" width="290" height="210" rx="16" class="card"/>
  <rect x="50" y="235" width="290" height="9" rx="4" fill="#3174a4"/>
  <text x="72" y="282" class="name">Search</text>
  <text x="72" y="313" class="tool">search-ProteomicMSMS</text>
  <text x="72" y="352" class="small">Comet · Sage · MSFragger</text>
  <text x="72" y="377" class="small">Select one or more engines</text>
  <text x="72" y="402" class="small">mzML → merged idXML</text>

  <rect x="420" y="235" width="290" height="210" rx="16" class="card"/>
  <rect x="420" y="235" width="290" height="9" rx="4" fill="#775ca6"/>
  <text x="442" y="282" class="name">Validate PSMs</text>
  <text x="442" y="313" class="tool">validate-ProteomicPSM</text>
  <text x="442" y="352" class="small">Percolator; optional ProtLoom</text>
  <text x="442" y="377" class="small">filtered idXML for quantitation</text>
  <text x="442" y="402" class="small">PEP idXML for ProteinProphet</text>

  <rect x="790" y="235" width="400" height="260" rx="16" class="card"/>
  <rect x="790" y="235" width="400" height="9" rx="4" fill="#b87832"/>
  <text x="812" y="278" class="name">Quantitate peptides</text>
  <text x="812" y="303" class="small">Select one branch by experiment_type</text>
  <rect x="812" y="318" width="356" height="68" rx="10" class="choice"/>
  <rect x="812" y="318" width="6" height="68" rx="3" fill="#b87832"/>
  <text x="831" y="345" class="tool">TMT · quantitate-ProteomicTMT</text>
  <text x="831" y="369" class="small">reporter ions → per-plex consensusXML</text>
  <rect x="812" y="399" width="356" height="68" rx="10" class="choice"/>
  <rect x="812" y="399" width="6" height="68" rx="3" fill="#b87832"/>
  <text x="831" y="426" class="tool">LFQ · quantitate-ProteomicLFQ</text>
  <text x="831" y="450" class="small">features → cohort consensusXML</text>

  <rect x="1270" y="235" width="280" height="260" rx="16" class="card"/>
  <rect x="1270" y="235" width="280" height="9" rx="4" fill="#26907f"/>
  <text x="1292" y="282" class="name">Quantitate proteins</text>
  <text x="1292" y="313" class="tool">quantitate-</text>
  <text x="1292" y="335" class="tool">ProteomicProtein</text>
  <text x="1292" y="376" class="small">ProteinProphet (default)</text>
  <text x="1292" y="400" class="small">or ProteinInferencer</text>
  <text x="1292" y="435" class="small">protein abundance CSVs</text>

  <path d="M340 340 H410" class="arrow"/>
  <text x="351" y="327" class="handoff">idXML</text>
  <path d="M710 340 H780" class="arrow"/>
  <text x="716" y="326" class="handoff">idXML</text>
  <path d="M1190 365 H1260" class="arrow"/>
  <text x="1193" y="349" class="handoff">consensus</text>
  <path d="M650 445 V530 H1410 V505" class="aux"/>
  <text x="880" y="519" class="handoff" style="fill:#775ca6">unfiltered PEP idXML for ProteinProphet</text>

  <rect x="50" y="585" width="650" height="100" rx="16" class="card"/>
  <rect x="50" y="585" width="9" height="100" rx="4" fill="#159a89"/>
  <text x="78" y="625" class="name">Target-decoy database</text>
  <text x="78" y="655" class="tool">Shared FASTA for search, validation, and protein inference</text>
  <path d="M195 585 V455" class="input"/>
  <path d="M520 585 V455" class="input"/>

  <path d="M1490 495 V575" class="arrow"/>
  <text x="1164" y="551" class="handoff">mzML + search + validation + protein outputs</text>
  <rect x="840" y="585" width="710" height="100" rx="16" class="card"/>
  <rect x="840" y="585" width="9" height="100" rx="4" fill="#5780a9"/>
  <text x="868" y="624" class="name">Quality control · qc-ProteomicDDA</text>
  <text x="868" y="653" class="tool">QC metrics TSV + per-fraction interactive MS1 maps</text>
</svg>
